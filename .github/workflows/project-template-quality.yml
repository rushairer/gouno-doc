name: Project template quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Rendered template quality (${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25.x', '1.26.x']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go }}
      - name: Verify rendered project
        run: bash scripts/verify-template.sh
