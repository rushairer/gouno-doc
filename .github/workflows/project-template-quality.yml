name: Project template quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Rendered template quality (${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - name: Verify rendered project
        run: bash scripts/verify-template.sh
