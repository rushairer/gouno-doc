name: Documentation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gouno-doc-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Documentation and workflow contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Validate documentation and reusable workflows
        run: bash scripts/check-docs.sh
