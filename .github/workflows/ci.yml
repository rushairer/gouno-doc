name: Documentation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gouno-doc-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Documentation and workflow contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate documentation and reusable workflows
        run: bash scripts/check-docs.sh
